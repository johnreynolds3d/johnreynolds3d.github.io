<!doctype html>
<html lang="en">

<head>
    <title>SPIDR (Babylon.js)</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#505050" />
    <style>
        body {
            margin: 0;
            overflow: hidden;
        }

        #renderCanvas {
            width: 100%;
            height: 100%;
            touch-action: none;
        }
    </style>
</head>

<body>
    <canvas id="renderCanvas"></canvas>

    <script type="module">
        import * as BABYLON from '@babylonjs/core';
        import HavokPhysics from '@babylonjs/havok';

        const canvas = document.getElementById('renderCanvas');
        const engine = new BABYLON.Engine(canvas, true);

        // Input State
        let legMovement = 0;
        let armMovement = 0;

        const createScene = async function () {
            const scene = new BABYLON.Scene(engine);
            scene.clearColor = new BABYLON.Color4(0, 0.75, 1, 1); // 0x00bfff

            // Camera
            const camera = new BABYLON.ArcRotateCamera('camera', -Math.PI / 2, Math.PI / 3, 15, new BABYLON.Vector3(0, 2, 0), scene);
            camera.attachControl(canvas, true);
            camera.wheelPrecision = 50;

            // Lights
            const hemiLight = new BABYLON.HemisphericLight('hemi', new BABYLON.Vector3(0, 1, 0), scene);
            hemiLight.intensity = 0.6;

            const dirLight = new BABYLON.DirectionalLight('dir', new BABYLON.Vector3(-1, -2, -0.5), scene);
            dirLight.position = new BABYLON.Vector3(-10, 10, 5);
            dirLight.intensity = 1.0;
            dirLight.shadowEnabled = true;

            // Shadows
            const shadowGenerator = new BABYLON.ShadowGenerator(2048, dirLight);
            shadowGenerator.useBlurExponentialShadowMap = true;

            // Physics
            // Physics
            let hk;
            try {
                const havokInstance = await HavokPhysics({
                    locateFile: () => './HavokPhysics.wasm'
                });
                hk = new BABYLON.HavokPlugin(true, havokInstance);
                scene.enablePhysics(new BABYLON.Vector3(0, -9.8, 0), hk);
                console.log("Havok Physics initialized successfully");
            } catch (e) {
                console.error("Havok Physics failed to initialize:", e);
            }

            console.log("Materials starting...");
            // Materials
            const groundMat = new BABYLON.StandardMaterial('groundMat', scene);
            groundMat.diffuseTexture = new BABYLON.Texture('images/grid.png', scene);
            groundMat.diffuseTexture.uScale = 40;
            groundMat.diffuseTexture.vScale = 40;
            groundMat.specularColor = new BABYLON.Color3(0.1, 0.1, 0.1);

            const bodyMat = new BABYLON.StandardMaterial('whiteMat', scene);
            bodyMat.diffuseColor = new BABYLON.Color3(0.97, 0.97, 0.97);
            console.log("Materials done. Creating Ground...");

            // Ground - Thick box to prevent falling through (Tunneling)
            // Visuals: Top at 0. Height 10. Center Y = -5.
            const ground = BABYLON.MeshBuilder.CreateBox('ground', { width: 100, height: 10, depth: 100 }, scene);
            ground.position.y = -5;
            ground.material = groundMat;
            ground.receiveShadows = true;

            // Static ground physics
            console.log("Creating Ground Aggregate...");
            // Use extents derived from mesh (box)
            const groundAgg = new BABYLON.PhysicsAggregate(ground, BABYLON.PhysicsShapeType.BOX, { mass: 0, restitution: 0.9 }, scene);
            console.log("Ground Aggregate done. Creating Body...");

            // --- PLAYER (Simple Cube) ---
            const playerMesh = BABYLON.MeshBuilder.CreateBox("player", { size: 2 }, scene);
            playerMesh.position.y = 2;
            playerMesh.receiveShadows = true;
            shadowGenerator.addShadowCaster(playerMesh);

            const playerMat = new BABYLON.StandardMaterial("playerMat", scene);
            playerMat.diffuseColor = new BABYLON.Color3(0.2, 0.6, 1.0); // Blue
            playerMesh.material = playerMat;

            // Physics
            const playerAgg = new BABYLON.PhysicsAggregate(playerMesh, BABYLON.PhysicsShapeType.BOX, { mass: 1, restitution: 0.1 }, scene);
            // Lock rotation so it doesn't tumble, just slides
            playerAgg.body.setMassProperties({
                inertia: new BABYLON.Vector3(0, 0, 0)
            });

            // --- INPUT HANDLING ---
            const inputMap = {};
            scene.actionManager = new BABYLON.ActionManager(scene);

            // Key Down
            scene.actionManager.registerAction(new BABYLON.ExecuteCodeAction(BABYLON.ActionManager.OnKeyDownTrigger, (evt) => {
                inputMap[evt.sourceEvent.key.toLowerCase()] = true;
            }));

            // Key Up
            scene.actionManager.registerAction(new BABYLON.ExecuteCodeAction(BABYLON.ActionManager.OnKeyUpTrigger, (evt) => {
                inputMap[evt.sourceEvent.key.toLowerCase()] = false;
            }));

            // Game Loop
            const speed = 10;
            scene.registerBeforeRender(() => {
                if (!playerAgg.body) return;

                const velocity = playerAgg.body.getLinearVelocity();
                const moveDir = new BABYLON.Vector3(0, 0, 0);

                // WASD Controls
                // -Z (Forward), -X (Left), Z (Backward), X (Right) as per request?
                // Standard Babylon: +Z is forward, +X is right.
                // User requested: -Z, -X, Z, X directions.

                if (inputMap["w"]) {
                    // Forward/Backward reversed
                    moveDir.z = 1;
                }
                if (inputMap["s"]) {
                    // Forward/Backward reversed
                    moveDir.z = -1;
                }
                if (inputMap["a"]) {
                    // Left (-X)
                    moveDir.x = -1;
                }
                if (inputMap["d"]) {
                    // Right (+X)
                    moveDir.x = 1;
                }

                // Normalize and Apply
                if (moveDir.length() > 0) {
                    moveDir.normalize();
                    // Apply velocity, keeping Y velocity (gravity)
                    playerAgg.body.setLinearVelocity(new BABYLON.Vector3(
                        moveDir.x * speed,
                        velocity.y,
                        moveDir.z * speed
                    ));
                } else {
                    // Dampen horizontal movement if no input (optional)
                    playerAgg.body.setLinearVelocity(new BABYLON.Vector3(
                        velocity.x * 0.9,
                        velocity.y,
                        velocity.z * 0.9
                    ));
                }
            });

            window.scene = scene;

            return scene;
        };

        createScene().then(scene => {
            engine.runRenderLoop(() => {
                scene.render();
            });
        }).catch(e => {
            console.error("createScene failed:", e);
        });

        window.addEventListener('resize', () => {
            engine.resize();
        });
    </script>
</body>

</html>
